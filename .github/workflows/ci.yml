name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: everything that needs no daemon. This is the job you reproduce
  # locally with `abel run lint`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: format
        run: go tool golangci-lint fmt --diff

      - name: lint
        run: go tool golangci-lint run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: unit tests
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: fuzz the workflow parser
        run: go test ./internal/core/workflow -run=Fuzz -fuzz=FuzzParse -fuzztime=30s

  # Slow lane: the Docker adapter against the real daemon the runner provides.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: integration tests
        run: go test -race -tags integration -count=1 ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool govulncheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-compile
        run: go tool goreleaser build --snapshot --clean --single-target
